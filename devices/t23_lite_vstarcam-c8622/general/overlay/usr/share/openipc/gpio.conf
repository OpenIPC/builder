#!/bin/sh

### board wiring reference (consumed only by resetd.sh's `button`) ###
# ircut lives on the GC6153F chip (i2c 0x10, regs 0x15/0x16/0x17), not on
# GPIO; the lamps are GPIO61 (IR) / GPIO50 (white) with the shared brightness
# line PB17 held high by S65gc6153.
alarm_in=-1
alarm_out=-1
button=58
ircut1=-1
ircut2=-1
led1=-1
led2=-1
light_ir=61
light_wl=50
light_sensor=-1
mmc_pwr=-1
speaker=63
usb=-1
