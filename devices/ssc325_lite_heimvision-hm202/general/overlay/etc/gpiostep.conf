# Heimvision HM202 pan/tilt head, read by majestic-af's gpiostep actuator. The
# coils sit on a 74HC595 (gpiostep sr_gpios=53,47,52, see /etc/modules).
# Travel from one gearbox stop to the other, in gpiostep steps: the vendor
# driver's hmotor_upbound / vmotor_upbound.
pan_travel=520
tilt_travel=180
# Raw +steps turn the head left and down, in the sensor's own orientation (the
# WebUI maps its arrows through image.mirror/flip).
pan_left=1
tilt_up=-1
pan_delay_us=833
tilt_delay_us=833
# Find both stops once per boot, then centre the head.
home=1
# Steps per frame width/height at 1920x1080, measured by image shift
# (about 13 px a pan step, 15 px a tilt step).
pan_frame_steps=148
tilt_frame_steps=72
