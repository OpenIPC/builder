; Imou LOOC 2 (IPC-C26EP-V2): OmniVision OV2735 on MIPI, read by libCamSensor
; as /data/cfg/sensor_db.cfg. Values from the camera's stock firmware, except
; CUSTOMER_AE/AWB/AF: the stock application runs 3A itself and sets them to 1,
; which leaves the picture black without it.
;
; The sensor driver is the one from the stock firmware: OpenIPC's
; libdrv_ms_cus_ov2735_MIPI.so only reaches 15 fps on this board, this one 25.

[I2C]
BUS_TYPE=ISP_I2C_EXTERNAL_1

[GLOBAL]
CUSTOMER_AE=0
CUSTOMER_AWB=0
CUSTOMER_AF=0

[SENSOR1]
LIB=/usr/lib/sensors/libdrv_ms_cus_ov2735_MIPI.so
IQ_FILE_NAME=ov2735_iqfile.bin.mz
F_NUMBER=18
MIRROR=0
FLIP=0
ISP_CLK=86
SENSOR_IO_PAD=6
MCLK=ISP_27M
CROP_START_X=0
CROP_START_Y=0
