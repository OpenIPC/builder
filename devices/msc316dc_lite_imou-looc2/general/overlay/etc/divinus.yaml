system:
  sensor_config: /etc/sensors/iqfile/ov2735_iqfile.bin.mz
  web_port: 80
  web_enable_auth: true
  web_auth_user: root
  web_auth_pass: @system
  web_auth_skiplocal: true
  web_enable_static: false
  isp_thread_stack_size: 16384
  venc_stream_thread_stack_size: 16384
  web_server_thread_stack_size: 65536
  time_format: %Y.%m.%d %H:%M:%S
  watchdog: 0
night_mode:
  enable: true
  ir_sensor_pin: 999
  check_interval_s: 5
  ir_cut_pin1: 97
  ir_cut_pin2: 96
  ir_led_pin: 61
  white_led_pin: 64
  pin_switch_delay_us: 1000
  adc_device: 
  adc_threshold: 128
  exposure_night: 50
  exposure_day: 12
isp:
  mirror: false
  flip: false
  antiflicker: 60
mdns:
  enable: false
onvif:
  enable: false
  enable_auth: false
  auth_user: 
  auth_pass: 
rtsp:
  enable: true
  port: 554
  audio_codec: mp3
  enable_auth: true
  auth_user: root
  auth_pass: @system
record:
  enable: false
  continuous: false
  path: /mnt/sdcard/recordings
  filename: 
  segment_duration: 300
  segment_size: 0
  reserve: 512
stream:
  enable: false
  udp_srcport: 0
audio:
  enable: true
  bitrate: 64
  gain: 0
  srate: 16000
mp4:
  enable: true
  codec: H.264
  audio: true
  mode: 0
  width: 1920
  height: 1080
  fps: 25
  gop: 50
  profile: 1
  bitrate: 2048
sub:
  enable: true
  width: 640
  height: 360
  gop: 30
  bitrate: 512
  rtsp_port: 555
osd:
  enable: true
    reg0_text: $t
    reg0_font: UbuntuMono-Regular
    reg0_opal: 64
    reg0_anchor: top-right
    reg0_posx: 16
    reg0_posy: 16
    reg0_size: 32.0
    reg0_color: 0xffff
    reg0_outl: 0x8000
    reg0_thick: 0.0
jpeg:
  enable: true
  width: 1280
  height: 720
  qfactor: 80
mjpeg:
  enable: false
  mode: 0
  width: 640
  height: 480
  fps: 15
  bitrate: 1024
  qfactor: 50
http_post:
  enable: false
  host: 
  url: 
  login: 
  password: 
  width: 0
  height: 0
  interval: 0
  qfactor: 0
