# Level of messages on console
kernel.printk = 3 3 1 3
net.core.bpf_jit_enable=1
# SysRq over the serial console: log level (2) and sync (16) only. A BREAK
# and one stray byte -- hot-plugging a UART adapter makes both -- runs any
# allowed key, and the kernel default allows them all: reboot, crash,
# kill-all, remount read-only, and on pre-4.9 kernels an emergency thaw that
# never returns (OpenIPC/linux#113). /proc/sysrq-trigger ignores this mask.
kernel.sysrq = 18

# Tapo C210 v2: rate-limit driver log floods and keep memory headroom for
# the network stack (from the 10-hour soak test in #231)
kernel.printk_ratelimit = 5
kernel.printk_ratelimit_burst = 10
vm.min_free_kbytes = 1024
