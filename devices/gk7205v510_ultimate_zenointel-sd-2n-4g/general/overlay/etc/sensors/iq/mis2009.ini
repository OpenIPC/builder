[static_dpc]
; Not the stock tuning, which has dynamic DPC off up to ISO 400: with it,
; the sensor's warm pixels come out of the sharpener as white dots on dark
; surfaces. See [static_sharpen], which goes with it. From ISO 1600 up, the
; vendor's own values.
