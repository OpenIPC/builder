; MIS2009 (ImageDesign), Zenointel SD-2N-4G (gk7205v510), for libsns_mis2009.
;
; The stock firmware's own image tuning: what its app (hunter, the ISP_Ext_*
; layer) programs on top of the sensor driver, read from the same per-sensor
; tuning blob the driver's defaults come from. Sharpen, 2D NR, LDCI,
; demosaic, CA and AFC are left to the driver, as the stock app leaves them,
; with two exceptions that together keep the sensor's warm pixels from
; becoming white dots on dark surfaces: [static_dpc], and the darkest luma
; levels of [static_sharpen]. Their comments say why.
;
; Day and night share one tuning, as they do on the stock camera; the night
; half differs in AE (speed 45, a lower compensation ladder) and is grey in
; the ISP (saturation 0, a flat matrix), so snapshots are grey too.

