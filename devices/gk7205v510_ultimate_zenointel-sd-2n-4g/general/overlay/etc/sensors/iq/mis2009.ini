DpcStrength               = "120, 120, 220, 220, 220, 220, 220, 220, 220, 220, 152, 152, 152, 152, 152, 152"

[static_sharpen]
; Not the stock tuning, which sharpens every luma level at weight 31. The
; darkest levels (bins 0-7) are eased to 0 and back up to it by bin 8:
; with dynamic DPC above, the warm pixels that the stock sharpener turned
; into white dots on dark surfaces are gone (36-58 dots on a black bag to
; 0, at the same gain), for 7% of the texture on a patterned towel.
; Every other sharpener setting is the driver's.
