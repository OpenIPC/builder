# Zenointel SD-2N-4G pan/tilt head, read by majestic-af's gpiostep actuator.
# Travel is gpiostep steps from one gearbox stop to the other, measured on the board.
pan_travel=580
tilt_travel=170
# Raw +steps turn the head right and up.
pan_left=-1
tilt_up=1
# Per-microstep delays while moving. gpiostep.ko ramps every move up from 2000 us,
# so this is the cruising rate: 833 us (~125 steps/s) is the stock firmware's top
# speed and leaves ~25% to where these motors start losing steps (~650 us).
# Homing runs slowly whatever this says (majestic-af's pan/tilt_home_delay_us).
pan_delay_us=833
tilt_delay_us=833
# Find both stops once per boot, then centre the head.
home=1
# Steps that turn the head by one whole frame of the picture, across and down,
# measured on the board by image shift at 1920x1080 (about 14.3 px a pan step
# and 17.5 px a tilt step): what centres a point double-tapped on the picture.
pan_frame_steps=134
tilt_frame_steps=62
