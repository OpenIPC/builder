; XiongMai JZC-N51813L: AR0130 set up by the zoom block's own MCU.
;
; The ISP cannot reach this sensor, so its own gain means nothing; the lens
; plugin (majestic-af visca) reports the MCU's gain as the ISO, and the 3DNR
; rungs below are fitted to the stock firmware's VPSS NR at the same
; light (4 in full light .. 51/25 at one bulb's 20 %).
;
; Black level, AWB calibration and colour matrices are the stock firmware's
; (Sofia's AR0130 entry, matching its live ISP registers). The V1 AWB does not
; follow its statistics on this sensor, so white balance comes from them
; directly (StatisticsLoop); CorrectionStrength keeps some of the light's
; colour, as stock does.

[3dnr]
SF = 4, 8, 20, 34, 44, 51, 51, 51;
TF = 4, 8, 12, 17, 22, 25, 25, 25;
SF_M = 4, 8, 20, 34, 44, 51, 51, 51;
TF_M = 4, 8, 12, 17, 22, 25, 25, 25;

[ir_3dnr]
SF = 51, 51, 51, 51, 51, 51, 51, 51;
TF = 25, 25, 25, 25, 25, 25, 25, 25;
SF_M = 51, 51, 51, 51, 51, 51, 51, 51;
TF_M = 25, 25, 25, 25, 25, 25, 25, 25;

[static_blacklevel]
BlackLevel = 168, 168, 168, 168;

[static_awb]
AutoCurvePara = 90, -14, -180, 209650, 128, -162566;
AutoStaticWb = 352, 256, 256, 420;
AutoRefColorTemp = 4800
StatisticsLoop = 1
CorrectionStrength = 80

[static_ccm]
AutoColorTemp = 4800, 3425, 2625;
AutoCCMTable = 0x01F9, 0x8098, 0x8061, 0x803B, 0x0161, 0x8026, 0x0014, 0x80AB, 0x0196, 0x01D3, 0x8087, 0x804C, 0x807C, 0x0194, 0x8018, 0x8012, 0x80BB, 0x01CD, 0x025E, 0x8106, 0x8058, 0x8020, 0x0115, 0x000A, 0x001B, 0x81A1, 0x0285;
