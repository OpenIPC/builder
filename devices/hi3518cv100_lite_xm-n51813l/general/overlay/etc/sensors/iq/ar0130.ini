; XiongMai JZC-N51813L: AR0130 set up by the zoom block's own MCU.
;
; The ISP cannot reach this sensor, so its own gain means nothing; the lens
; plugin (majestic-af visca) reports the MCU's gain as the ISO, and the 3DNR
; rungs below are fitted to the stock firmware's VPSS NR at the same light,
; on the plugin's measured ISO scale (majestic-af#53). These are VPSS
; readings (/proc/umap/vpss SF/TF/chroma range), not rung values: the ISP
; interpolates between rungs (rung i at ISO 100 << i) at the live ISO.
;   bulbs  stock     OpenIPC with these rungs
;   100 %  4/4/4     5/5/5
;    50 %  13/11/13  14/11/14
;    35 %  21/13/21  26/14/26
;    25 %  41/20/41  42/20/42
;    12 %  51/25/51  51/25/51
; CR_M is the chroma range, which stock runs at SF.
;
; Black level, AWB calibration and colour matrices are the stock firmware's
; (Sofia's AR0130 entry, matching its live ISP registers). The V1 AWB does not
; follow its statistics on this sensor, so white balance comes from them
; directly (StatisticsLoop); CorrectionStrength keeps some of the light's
; colour, as stock does.
;
; Sharpening and the ISP's 2D denoise are the stock board library's
; (LIBISP:AR0130_N51813 in Sofia), which sharpen and denoise far harder than
; the SDK's libsns_ar0130; saturation falls more gently with gain than the
; library's, matched to stock on a ColorChecker. Rung i is ISO 100 << i.
; Gen 1 majestic reads these three sections, and [static_gamma] at the end,
; from 2026-11-14 on; an older one skips them and keeps the library's tables
; and curves, which is harmless. majestic's
; startup log says "[static_sharpen] applied" (and so on) when they took.

[3dnr]
SF = 4, 5, 10, 13, 21, 38, 51, 51;
TF = 4, 5, 9, 11, 13, 18, 25, 25;
SF_M = 4, 5, 10, 13, 21, 38, 51, 51;
TF_M = 4, 5, 9, 11, 13, 18, 25, 25;
CR_M = 4, 5, 10, 13, 21, 38, 51, 51;

[ir_3dnr]
SF = 51, 51, 51, 51, 51, 51, 51, 51;
TF = 25, 25, 25, 25, 25, 25, 25, 25;
SF_M = 51, 51, 51, 51, 51, 51, 51, 51;
TF_M = 25, 25, 25, 25, 25, 25, 25, 25;
CR_M = 51, 51, 51, 51, 51, 51, 51, 51;

[static_blacklevel]
BlackLevel = 168, 168, 168, 168;

[static_awb]
AutoCurvePara = 90, -14, -180, 209650, 128, -162566;
AutoStaticWb = 352, 256, 256, 420;
AutoRefColorTemp = 4800
StatisticsLoop = 1
CorrectionStrength = 80
; White only from the zones the vendor AWB would call grey, in place of grey
; world, which this room's orange and wood pulled green. ColorChecker colour
; error at 3000-6000 K, against stock: within 1.3 dE in full light (8.4-15.4
; vs 7.1-15.4), better at 25 % (8.9-14.3 vs 14.2-17.5) and 5 % (11.8-14.9 vs
; 16.2-17.8). A majestic that predates StatisticsZones ignores the key and
; stays on grey world; one that has it leaves the grey patches neutral
; rather than green-cyan.
StatisticsZones = 1

[static_ccm]
AutoColorTemp = 4800, 3425, 2625;
AutoCCMTable = 0x01F9, 0x8098, 0x8061, 0x803B, 0x0161, 0x8026, 0x0014, 0x80AB, 0x0196, 0x01D3, 0x8087, 0x804C, 0x807C, 0x0194, 0x8018, 0x8012, 0x80BB, 0x01CD, 0x025E, 0x8106, 0x8058, 0x8020, 0x0115, 0x000A, 0x001B, 0x81A1, 0x0285;

[static_sharpen]
SharpenAltD = 80, 72, 64, 56, 52, 48, 40, 40;
SharpenAltUd = 144, 136, 128, 112, 96, 80, 64, 64;

[static_nr]
SnrThresh = 19, 25, 56, 69, 74, 80, 96, 112;

[static_saturation]
AutoSat = 128, 128, 116, 96, 92, 92, 92, 88;

