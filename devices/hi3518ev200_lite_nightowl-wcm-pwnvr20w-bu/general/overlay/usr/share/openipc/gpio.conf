alarm_in=-1
alarm_out=-1
button=-1 # the stock app polls GPIO 51 (active low) as a reset key, but none is fitted: it reads 0 at rest
ircut1=65 # high 150 ms = filter out (night) (verified)
ircut2=64 # high 150 ms = filter in (day) (verified)
led1=8 # power/status LED, active high (verified); needs devmem 0x200f007c 32 0 after S70vendor, whose load_hisilicon muxes the pad back to VI_DATA13
led2=-1
light_ir=63 # IR LED ring, active high (verified)
light_wl=-1
light_sensor=62 # photoresistor, read as a logic input: 0 in daylight, 1 in the dark (verified); also SAR ADC channel 0
mmc_pwr=-1
speaker=37 # amp enable, active high: silent when low (verified)
usb=-1
