# APPIX SC03-W: two SC1346 behind one MIPI switch, loaded as the camera's
# stock vg_boot.sh loads them (video_dev_num=2): ak_isp in switch mode, and
# the sensor module moving the two sensors to 0x32 and 0x31
# (OpenIPC/majestic#380). The USB host runs in CPU mode, as for every EV300L.
options ak_isp flip_drop_frames=5 chgfps_drop_frames=5 multi_cis_switch=1
options ak_hcd cpu_mode=1
options sensor_sc1346 addr0=0x32 addr1=0x31
