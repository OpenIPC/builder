# APPIX SC03-W pan/tilt head, read by majestic-af's gpiostep actuator. The
# coils are on GPIO (gpiostep pan_gpios=25,24,56,55 tilt_gpios=68,58,26,27,
# see /etc/modules), the stock device tree's motor0 and motor1 pins. That
# two-parameter line loads since OpenIPC/firmware#2937.
# Travel from one gearbox stop to the other, in gpiostep steps, counted on
# the camera (OpenIPC/majestic#380).
pan_travel=1030
tilt_travel=130
# Raw +steps turn the head left and up, with the picture upright: +pan
# slides the view from left to right (gpiostep-ctl 50 0 3), and the WebUI's
# arrows went the wrong way with pan_left=-1 (OpenIPC/majestic#380).
pan_left=1
tilt_up=1
# Per micro-step. Pan runs smoothly at 1 ms on the camera once the kernel
# schedules sub-tick timers (OpenIPC/linux#317); tilt was checked at 3 ms.
pan_delay_us=1000
tilt_delay_us=3000
# Find both stops once per boot, then centre the head.
home=1
